[project]
name = "spatial-file-measurement-api"
version = "1.0.0"
description = "REST API for geospatial file measurement (KML + Shapefile)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "geopandas",
  "shapely",
  "pyproj",
  "pyogrio",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "python-multipart",
  "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # B008 conflicts with idiomatic FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"scripts/generate_sample_data.py" = ["E501"]  # long embedded KML fixture lines
"scripts/generate_demo_samples.py" = ["E501"]  # long embedded KML fixture lines

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.alembic]
script_location = "app/db/migrations"
