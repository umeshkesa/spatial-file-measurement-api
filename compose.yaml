services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./spatial.db
      STORAGE_DIR: ./uploads
      MAX_UPLOAD_BYTES: 26214400
    volumes:
      - ./backend/uploads:/code/uploads
      - ./backend/spatial.db:/code/spatial.db
